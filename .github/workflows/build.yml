name: 编译 (自动)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: 编译 Windows 版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: 构建 WASM 模块
        working-directory: rustatio-wasm
        shell: pwsh
        run: wasm-pack build --target web --out-dir ../ui/src/lib/wasm --release

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: 构建前端
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          npx vite build

      - name: 编译桌面程序
        shell: pwsh
        run: cargo build --release -p rustatio

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Rustatio-win64
          path: target/release/rustatio-desktop.exe
          retention-days: 30
          if-no-files-found: error

# 首次推送验证:此提交用于确认 push 自动编译正常触发
