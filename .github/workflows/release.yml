name: 发布 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 编译并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: 构建 WASM 模块
        working-directory: rustatio-wasm
        shell: pwsh
        run: wasm-pack build --target web --out-dir ../ui/src/lib/wasm --release

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: 构建前端
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          npx vite build

      - name: 编译桌面程序
        shell: pwsh
        run: cargo build --release -p rustatio

      - name: 重命名产物
        shell: pwsh
        run: |
          Copy-Item target/release/rustatio-desktop.exe "Rustatio-${{ github.ref_name }}-win64.exe"

      - name: 读取 tag 中文更新说明
        id: notes
        shell: bash
        run: |
          # checkout 可能本地把注释 tag 轻量化,因此优先走 GitHub API 读服务器上的 tag 注释
          REF_JSON=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${GITHUB_REF_NAME}" || true)
          TAG_SHA=$(printf '%s' "$REF_JSON" | jq -r --arg r "refs/tags/${GITHUB_REF_NAME}" '[.[] | select(.ref == $r)][0].object.sha // empty' 2>/dev/null || true)
          BODY=""
          if [ -n "$TAG_SHA" ]; then
            TAG_JSON=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" || true)
            BODY=$(printf '%s' "$TAG_JSON" | jq -r 'select(.type == "tag") | ((.message // "") | split("\n\n") | .[1:] | join("\n\n"))' 2>/dev/null | sed '/./,$!d' || true)
          fi
          # 兜底:本地 tag 对象
          if [ -z "$BODY" ]; then
            BODY=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")
          fi
          if [ -z "$BODY" ]; then
            BODY=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")
          fi
          { printf '# 更新内容\n\n'; printf '%s\n' "$BODY"; } > release-notes.md
          echo "---- release-notes.md ----"
          cat release-notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rustatio ${{ github.ref_name }} 中文合并版
          body_path: release-notes.md
          files: Rustatio-${{ github.ref_name }}-win64.exe
          draft: false
          prerelease: false

      # action-gh-release 对已存在的 Release 不会重写 body(例如重推 tag 时),
      # 这里显式 PATCH 一次,确保中文说明始终与 tag 注释一致
      - name: 同步 Release 中文说明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          RELEASE_ID=$(curl -sf "${AUTH[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            # tag 被删过时 Release 会变 draft,该接口不返回 draft,从列表里按 tag_name 找
            RELEASE_ID=$(curl -sf "${AUTH[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -r --arg t "${GITHUB_REF_NAME}" '[.[] | select(.tag_name == $t)][0].id // empty')
          fi
          if [ -n "$RELEASE_ID" ]; then
            jq -n --rawfile body release-notes.md '{body: $body}' > release-payload.json
            curl -sf -X PATCH "${AUTH[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --data-binary @release-payload.json > /dev/null
            echo "Release ${RELEASE_ID} 中文说明已同步"
          else
            echo "未找到已存在的 Release,跳过同步"
          fi
